# Nixpacks configuration for Railway

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build",
  "mkdir -p .next/standalone/.next",
  "cp -r .next/static .next/standalone/.next/",
  "cp -r public .next/standalone/",
  "cp -r node_modules/.prisma .next/standalone/node_modules/"
]

[start]
cmd = "npx prisma db push --skip-generate --accept-data-loss && HOSTNAME=0.0.0.0 PORT=${PORT:-8080} node .next/standalone/server.js"
