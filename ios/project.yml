name: ShiftSync
options:
  bundleIdPrefix: com.shiftsync
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ShiftSync:
    type: application
    platform: iOS
    sources:
      - path: ShiftSync
        excludes:
          - "Preview Content"
    resources:
      - path: ShiftSync/Assets.xcassets
      - path: ShiftSync/Preview Content
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiftsync.app
        INFOPLIST_FILE: ShiftSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShiftSync/ShiftSync.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: ShiftSync
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.business"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    dependencies:
      - target: ShiftSyncWidgetExtension

  ShiftSyncWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShiftSyncWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiftsync.app.widget
        INFOPLIST_FILE: ShiftSyncWidgetExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "ShiftSync Widget"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO

  ShiftSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShiftSyncTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiftsync.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShiftSync.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ShiftSync"
    dependencies:
      - target: ShiftSync

schemes:
  ShiftSync:
    build:
      targets:
        ShiftSync: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShiftSyncTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
